name: Build and Release Android APK/AAB

on:
  push:
    branches:
      - SP-01-git-hub-actions-2

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/buildSrc/**/*.kt') }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create secrets file
        run: |
          cat <<EOF > secrets.properties
          tracer.application.token=${{ secrets.TRACER_APPLICATION_TOKEN }}
          tracer.plugin.token=${{ secrets.TRACER_PLUGIN_TOKEN }}
          com.sportsauce.api.path.prod=${{ secrets.SPORTSAUCE_API_PROD_PATH }}
          com.sportsauce.api.path.dev=${{ secrets.SPORTSAUCE_API_DEV_PATH }}
          storePassword64=${{ secrets.SPORTSAUCE_ANDROID_STORE_PASSWORD }}
          keyAlias64=${{ secrets.SPORTSAUCE_ANDROID_KEY_ALIAS }}
          keyPassword64=${{ secrets.SPORTSAUCE_ANDROID_KEY_PASSWORD }}
          EOF

      - name: Create keystore file
        run: |
          echo "${{ secrets.SPORTSAUCE_ANDROID_STORE_FILE }}" | base64 --decode > key-store.jks

      - name: Build Release APK and AAB
        run: |
          ./gradlew instances:app-android:assembleRelease instances:app-android:bundleRelease --no-configuration-cache

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$VERSION_NAME.$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "release_name=Sportsauce App $VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION_NAME=$(grep 'versionName = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M UTC')
          
          # Читаем файл и заменяем переменные
          RELEASE_NOTES=$(cat .github/whatsnew/whatsnew-en-US)
          RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed "s/\$APP_VERSION/$VERSION_NAME/g")
          RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed "s/\$(date '+%Y-%m-%d %H:%M UTC')/$BUILD_DATE/g")
          
          # Сохраняем в файл для корректного форматирования
          echo "$RELEASE_NOTES" > release_notes.md
          
          # Используем многострочный output для GitHub Actions
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Find APK file
        id: apk
        run: |
          APK_PATH=$(find instances/app-android/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Find AAB file
        id: aab
        run: |
          AAB_PATH=$(find instances/app-android/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          release_name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: false
          body: ${{ steps.release_notes.outputs.notes }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.apk.outputs.apk_path }}
          asset_name: ${{ steps.apk.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB artifact for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: ${{ steps.aab.outputs.aab_path }}
          retention-days: 7

      - name: Clean up keystore
        if: always()
        run: |
          rm -f key-store.jks
          rm -f release_notes.md

  deploy-to-google-play:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout (for whatsnew files)
        uses: actions/checkout@v4.2.1

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: ./

      - name: Create service account file
        run: |
          echo "${{ secrets.SPORTSAUCE_SERVICE_ACCOUNT_JSON }}" | base64 --decode > service-account.json

      - name: Prepare Google Play release notes
        run: |
          VERSION_NAME="${{ needs.build-and-release.outputs.version_name }}"
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M UTC')
          
          # Создаем папку для Google Play whatsnew файлов
          mkdir -p whatsnew
          
          # Подготавливаем английскую версию
          NOTES_EN=$(cat .github/whatsnew/whatsnew-en-US)
          NOTES_EN=$(echo "$NOTES_EN" | sed "s/\$APP_VERSION/$VERSION_NAME/g")
          NOTES_EN=$(echo "$NOTES_EN" | sed "s/\$(date '+%Y-%m-%d %H:%M UTC')/$BUILD_DATE/g")
          echo "$NOTES_EN" > whatsnew/whatsnew-en-US
          
          # Подготавливаем русскую версию
          NOTES_RU=$(cat .github/whatsnew/whatsnew-ru-RU)
          NOTES_RU=$(echo "$NOTES_RU" | sed "s/\$APP_VERSION/$VERSION_NAME/g")
          NOTES_RU=$(echo "$NOTES_RU" | sed "s/\$(дата '+%Y-%m-%d %H:%M UTC')/$BUILD_DATE/g")
          echo "$NOTES_RU" > whatsnew/whatsnew-ru-RU

      - name: Find AAB file
        id: aab
        run: |
          AAB_PATH=$(find . -name "*.aab" | head -1)
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service-account.json
          packageName: ${{ secrets.SPORTSAUCE_PACKAGE_NAME }}
          releaseFiles: ${{ steps.aab.outputs.aab_path }}
          track: internal
          status: completed
          whatsNewDirectory: whatsnew/
          inAppUpdatePriority: 2

      - name: Notify success
        run: |
          echo "✅ Successfully uploaded to Google Play Internal Testing!"
          echo "Version: ${{ needs.build-and-release.outputs.version_name }}"
          echo "Version Code: ${{ needs.build-and-release.outputs.version_code }}"
          echo "🔗 Check your Google Play Console: https://play.google.com/console/"

      - name: Clean up
        if: always()
        run: |
          rm -f service-account.json
          rm -rf whatsnew/